<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>갠홈</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-window">
<div class="punch-margin left"><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div></div>
<div class="app-shell">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="profile-block">
      <input class="profile-name" id="profileName" value="이름" readonly />
      <textarea class="profile-bio" id="profileBio" placeholder="간단한 소개글" readonly>여기에 소개글을 적어주세요.</textarea>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="home">Home</button>
      <button class="nav-item" data-view="pair">Pair</button>
      <div class="nav-sub" id="pairSub">
        <button class="nav-sub-item active" data-pairsub="all">전체</button>
        <button class="nav-sub-item" data-pairsub="aichat">Ai chat</button>
        <button class="nav-sub-item" data-pairsub="dream">Dream</button>
      </div>
      <button class="nav-item" data-view="archive">Archive</button>
      <div class="nav-sub" id="archiveSub">
        <button class="nav-sub-item active" data-archivesub="ooc">OOC</button>
        <button class="nav-sub-item" data-archivesub="nai">PROMPT</button>
        <button class="nav-sub-item" data-archivesub="etc">ETC</button>
      </div>
    </nav>

    <div class="login-widget">
      <span class="login-badge" id="loginBadge">LOCKED</span>
      <button class="login-btn-small" id="loginBtn">로그인</button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <!-- ---------- HOME ---------- -->
    <section class="view active" id="view-home">
      <div class="home-pages-wrap" id="homePagesWrap">

        <div class="home-page" id="home-intro-page">
          <div class="intro-card">
            <div class="adjustable-img intro-banner" id="introBannerBox">
              <div class="adj-layer"></div>
              <button class="adj-empty" data-editonly>＋ 배너 이미지</button>
              <button class="adj-change" data-editonly>📷</button>
            </div>
            <input class="intro-sitename" id="siteName" value="사이트 이름" readonly />
            <div class="intro-divider">*</div>
            <div class="home-intro" id="homeIntro" contenteditable="false"></div>
          </div>
        </div>

        <div class="home-page" id="home-cards-page">
          <div class="cards-topbar">
            <h3 class="li-title"><span class="li-icon">❣</span><span class="li-divider"></span>Love Interest</h3>
            <button class="add-card-mini" id="addCardBtn" data-editonly title="카드 추가">＋</button>
          </div>
          <div class="cards-section">
            <div class="card-grid" id="cardGrid"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- ---------- PAIR ---------- -->
    <section class="view" id="view-pair">
      <div class="topbar">
        <h2 id="pairTitle">Pair · 전체</h2>
        <div class="pair-header-actions" data-editonly>
          <button class="btn-ghost" id="selectPairBtn">선택</button>
          <button class="btn-primary" id="writePairBtn">＋ 글쓰기</button>
        </div>
      </div>
      <div class="pair-select-bar" id="pairSelectBar" style="display:none;">
        <span id="selectCountLabel">0개 선택됨</span>
        <button class="btn-ghost" id="moveToAichatBtn">AI CHAT로 이동</button>
        <button class="btn-ghost" id="moveToDreamBtn">DREAM으로 이동</button>
        <button class="btn-ghost" id="deleteSelectedBtn">🗑 삭제</button>
      </div>
      <div class="pair-body">
        <div class="post-grid" id="postGrid"></div>
      </div>
    </section>

    <!-- ---------- ARCHIVE ---------- -->
    <section class="view" id="view-archive">
      <div class="topbar">
        <h2>Archive</h2>
        <button class="btn-primary" id="addArchiveBtn" data-editonly>＋ 글쓰기</button>
      </div>
      <div class="archive-body" id="archiveBody"></div>
    </section>

  </main>
</div>
<div class="punch-margin right"><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div></div>
</div>

<!-- ================= MODALS ================= -->

<div class="modal-overlay" id="modalLogin">
  <div class="modal login-modal">
    <button class="modal-close" data-close>✕</button>
    <h3>로그인</h3>
    <div class="form-row"><label>이메일</label><input type="email" id="loginId" autocomplete="username" /></div>
    <div class="form-row"><label>Password</label><input type="password" id="loginPw" autocomplete="off" /></div>
    <div class="login-error" id="loginError">ID 또는 비밀번호가 일치하지 않습니다.</div>
    <div class="form-actions"><button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="loginSubmitBtn">로그인</button></div>
  </div>
</div>

<!-- Pair detail / edit popup (레이아웃 그대로, 인라인 편집) -->
<div class="modal-overlay" id="modalPairDetail">
  <div class="pd-modal-wrap">
  <div class="modal wide pd-modal">
    <button class="modal-close" data-close>✕</button>

    <div class="adjustable-img pd-header-banner" id="pdHeaderImgBox">
      <div class="adj-layer"></div>
      <button class="adj-empty" data-editonly>＋ 헤더 이미지</button>
      <button class="adj-change" data-editonly>📷</button>
    </div>
    <div class="pd-header-fade"></div>

    <div class="pd-modal-body">
    <input class="pd-title-input" id="pdTitleInput" placeholder="페어 이름" readonly />
    <input class="pd-subtitle-input" id="pdSubtitleInput" placeholder="부제목" readonly />

    <div class="pd-tab-content">

        <div class="pd-tab-pane active" data-pdpane="info">
          <div class="pd-info-grid">
            <div class="pd-info-main">
              <div class="pd-section">
                <h4>Profile</h4>

                <div class="pd-profile char-layout">
                  <div class="adjustable-img pd-profile-img" id="pdCharImgBox">
                    <div class="adj-layer"></div>
                    <button class="adj-empty" data-editonly>＋ 사진 추가</button>
                    <button class="adj-change" data-editonly>📷</button>
                  </div>
                  <div class="pd-profile-info">
                    <div class="pd-meta-row">
                      <input class="pd-input pd-name-input" id="pdCharName" placeholder="이름" readonly />
                    </div>
                    <div class="pd-profile-divider"></div>
                    <div class="rt-toolbar" data-editonly data-target="pdCharIntro" data-meta-target="pdCharMeta">
                      <button type="button" class="rt-add-row" title="정보 행 추가">＋</button>
                      <button type="button" data-cmd="bold"><b>B</b></button>
                      <button type="button" data-cmd="italic"><i>I</i></button>
                      <input type="color" class="rt-color" value="#1b1b1f" title="글자색" />
                    </div>
                    <div class="pd-desc-box">
                      <div class="meta-container" id="pdCharMeta"></div>
                      <div class="profile-view-text" id="pdCharIntro" contenteditable="false"></div>
                    </div>
                  </div>
                </div>

                <div class="speech-bubble char-bubble" id="pdCharBubble" contenteditable="false"></div>
                <div class="speech-bubble persona-bubble" id="pdPersonaBubble" contenteditable="false"></div>

                <div class="pd-profile persona-layout">
                  <div class="pd-profile-info">
                    <div class="pd-meta-row">
                      <input class="pd-input pd-name-input" id="pdPersonaName" placeholder="이름" readonly />
                    </div>
                    <div class="pd-profile-divider"></div>
                    <div class="rt-toolbar" data-editonly data-target="pdPersonaIntro" data-meta-target="pdPersonaMeta">
                      <button type="button" class="rt-add-row" title="정보 행 추가">＋</button>
                      <button type="button" data-cmd="bold"><b>B</b></button>
                      <button type="button" data-cmd="italic"><i>I</i></button>
                      <input type="color" class="rt-color" value="#1b1b1f" title="글자색" />
                    </div>
                    <div class="pd-desc-box">
                      <div class="meta-container" id="pdPersonaMeta"></div>
                      <div class="profile-view-text" id="pdPersonaIntro" contenteditable="false"></div>
                    </div>
                  </div>
                  <div class="adjustable-img pd-profile-img" id="pdPersonaImgBox">
                    <div class="adj-layer"></div>
                    <button class="adj-empty" data-editonly>＋ 사진 추가</button>
                    <button class="adj-change" data-editonly>📷</button>
                  </div>
                </div>
              </div>

              <div class="pd-relationship">
                <div class="rel-box">
                  <div class="rel-label" id="relLabelCharToPersona" contenteditable="false"></div>
                  <div class="rel-text" id="relCharToPersona" contenteditable="false"></div>
                </div>
                <div class="rel-icon">⇄</div>
                <div class="rel-box">
                  <div class="rel-label" id="relLabelPersonaToChar" contenteditable="false"></div>
                  <div class="rel-text" id="relPersonaToChar" contenteditable="false"></div>
                </div>
              </div>
            </div>

            <div class="pd-info-side">
              <div class="pd-section pd-section-nohead">
                <h4>TIMELINE</h4>
                <button class="add-mini-btn" id="addTimelineBtn" data-editonly>＋ 타임라인 추가</button>
                <div class="timeline-list" id="timelineList"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="pd-tab-pane pd-tab-pane-gallery" data-pdpane="gallery">
          <div class="gallery-folder-bar" id="galleryFolderBar"></div>
          <div class="gallery-select-info" id="gallerySelectInfo" style="display:none;"></div>
          <div class="gallery-grid-wrap" id="galleryGridWrap">
            <div class="gallery-scroll-hint up" id="galleryScrollHintUp" style="display:none;">︽</div>
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="gallery-scroll-hint" id="galleryScrollHint" style="display:none;">︾</div>
          </div>
          <div class="gallery-fab-row">
            <button class="gallery-fab" id="gallerySelectDeleteBtn" data-editonly title="선택 삭제" style="display:none;">🗑</button>
            <button class="gallery-fab" id="gallerySelectBtn" data-editonly title="선택">✓</button>
            <button class="gallery-fab" id="addGalleryBtn" data-editonly title="이미지 추가">＋</button>
          </div>
        </div>

        <div class="pd-tab-pane pd-tab-pane-log" data-pdpane="log">
          <div class="log-pane-toolbar"><button class="add-mini-btn" id="addLogBtn" data-editonly>＋ 게시글 추가</button></div>
          <div class="log-search" id="logSearchBar">
            <select id="logSearchField">
              <option value="title">제목</option>
              <option value="content">내용</option>
              <option value="date">작성일</option>
            </select>
            <input type="text" id="logSearchInput" placeholder="검색어를 입력하세요" />
            <button type="button" id="logSearchClear" title="검색 초기화">✕</button>
          </div>
          <div class="log-list" id="logList"></div>
        </div>

      </div>
    </div>
  </div>
  <div class="pd-index-tabs">
    <button type="button" class="pd-index-tab active" data-pdtab="info">INFO</button>
    <button type="button" class="pd-index-tab" data-pdtab="gallery">GALLERY</button>
    <button type="button" class="pd-index-tab" data-pdtab="log">LOG</button>
  </div>
  </div>
</div>

<!-- Log write / view -->
<div class="modal-overlay" id="modalLogWrite">
  <div class="modal">
    <button class="modal-close" data-close>✕</button>
    <h3 id="logWriteHeading">게시글 작성</h3>
    <div class="form-row"><label>제목</label><input type="text" id="logTitle" /></div>
    <div class="form-row"><label>내용</label>
      <div class="rt-toolbar rt-toolbar-log">
        <button type="button" data-cmd="bold" title="볼드"><b>B</b></button>
        <button type="button" data-cmd="italic" title="이탤릭"><i>I</i></button>
        <button type="button" id="logSubColorBtn" title="보조색 적용">A</button>
        <button type="button" id="logHighlightBtn" title="형광펜">✎</button>
        <button type="button" id="logDividerBtn" title="구분선">―</button>
        <span class="rt-sep"></span>
        <div class="rt-colorbar">
          <label class="rt-colorcell"><input type="color" id="logTextColor" value="#1a1a1a" /><span>글자색</span></label>
          <label class="rt-colorcell"><input type="color" id="logSubColor" value="#c1440e" /><span>보조색</span></label>
          <label class="rt-colorcell"><input type="color" id="logParenColor" value="#6b675e" /><span>괄호색</span></label>
          <label class="rt-colorcell"><input type="color" id="logHighlightColor" value="#f8ddbf" /><span>형광펜</span></label>
        </div>
      </div>
      <div class="profile-view-text log-editor" id="logContent" contenteditable="true"></div>
      <div class="log-autofmt-hint">&quot;따옴표&quot; 보조색 · (괄호) 괄호색 · **별표** 볼드 — 저장 시 자동 적용됩니다.</div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;" id="logWriteHint">작성 시각이 자동으로 기록됩니다.</div>
    <div class="form-actions"><button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="saveLogBtn">저장</button></div>
  </div>
</div>
<div class="modal-overlay" id="modalLogView">
  <div class="modal">
    <button class="modal-close" data-close>✕</button>
    <button class="arc-kebab-btn" id="logKebabBtn" data-editonly title="더보기">⋮</button>
    <div class="arc-kebab-menu" id="logKebabMenu">
      <button type="button" id="logEditBtn">✎ 수정</button>
      <button type="button" id="logDeleteBtn">🗑 삭제</button>
    </div>
    <h3 id="logViewTitle"></h3>
    <div style="font-size:10.5px;color:var(--text-muted);margin-bottom:28px;" id="logViewDate"></div>
    <div class="profile-view-text arc-view-content" id="logViewContent"></div>
  </div>
</div>

<!-- Archive write / view modals -->
<div class="modal-overlay" id="modalArcWrite">
  <div class="modal wide arc-modal">
    <button class="modal-close" data-close>✕</button>
    <h3 id="arcWriteHeading">글쓰기</h3>
    <div class="form-row"><label>카테고리</label>
      <select id="arcCategoryInput">
        <option value="ooc">OOC</option>
        <option value="nai">PROMPT</option>
        <option value="etc">ETC</option>
      </select>
    </div>
    <div class="form-row"><input type="text" id="arcTitleInput" placeholder="제목" /></div>
    <div class="rt-toolbar rt-toolbar-arc">
      <button type="button" data-cmd="bold"><b>B</b></button>
      <button type="button" data-cmd="italic"><i>I</i></button>
      <button type="button" data-cmd="underline"><u>U</u></button>
      <button type="button" data-cmd="strikeThrough"><s>S</s></button>
      <input type="color" class="rt-color" id="arcColorInput" value="#1a1a1a" title="글자색" />
      <span class="rt-sep"></span>
      <button type="button" data-cmd="justifyLeft" title="왼쪽 정렬">⯇</button>
      <button type="button" data-cmd="justifyCenter" title="가운데 정렬">≡</button>
      <button type="button" data-cmd="justifyRight" title="오른쪽 정렬">⯈</button>
      <button type="button" data-cmd="blockquote" title="인용구">❝</button>
      <span class="rt-sep"></span>
      <button type="button" id="arcInsertImageBtn" title="사진 삽입">🖼</button>
      <button type="button" id="arcInsertFileBtn" title="파일 삽입">📎</button>
      <button type="button" id="arcInsertCodeBtn" title="코드 삽입">&lt;/&gt;</button>
    </div>
    <div class="profile-view-text arc-editor" id="arcContentEditor" contenteditable="true"></div>
    <div class="arc-attach-section">
      <div class="arc-attach-label">첨부 파일</div>
      <div class="arc-attach-list" id="arcAttachList"></div>
    </div>
    <div class="form-actions"><button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="saveArcBtn">게시</button></div>
  </div>
</div>

<!-- 코드 삽입용 미니 모달 -->
<div class="modal-overlay" id="modalArcCode">
  <div class="modal">
    <button class="modal-close" data-close>✕</button>
    <h3>코드 삽입</h3>
    <div class="form-row"><textarea id="arcCodeInput" style="min-height:140px;font-family:var(--mono);font-size:11.5px;" placeholder="HTML 코드를 입력하세요"></textarea></div>
    <div class="form-actions"><button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="arcCodeInsertBtn">삽입</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalArcView">
  <div class="modal wide arc-modal">
    <button class="modal-close" data-close>✕</button>
    <button class="arc-kebab-btn" id="arcKebabBtn" data-editonly title="더보기">⋮</button>
    <div class="arc-kebab-menu" id="arcKebabMenu">
      <button type="button" id="arcPinBtn">📌 고정</button>
      <button type="button" id="arcEditBtn">✎ 수정</button>
      <button type="button" id="arcDeleteBtn">🗑 삭제</button>
    </div>
    <div class="arc-view-head">
      <h3 id="arcViewTitle"></h3>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;" id="arcViewDate"></div>
    <div class="profile-view-text arc-view-content" id="arcViewContent"></div>
    <div class="arc-attach-section" id="arcViewAttachSection" style="display:none;">
      <div class="arc-attach-label">첨부 파일</div>
      <div class="arc-attach-list" id="arcViewAttachList"></div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-nav" id="lbPrev">‹</button>
  <img id="lightboxImg" />
  <button class="lb-nav" id="lbNext">›</button>
</div>

<div class="arc-lightbox" id="arcLightbox">
  <button class="arc-lb-close" id="arcLbClose">✕</button>
  <button class="arc-lb-nav" id="arcLbPrev">‹</button>
  <div class="arc-lb-main-wrap"><img id="arcLbMain" /></div>
  <button class="arc-lb-nav" id="arcLbNext">›</button>
  <div class="arc-lb-thumbs" id="arcLbThumbs"></div>
</div>


<script src="js/main.js"></script>
<script type="module" src="js/firebase-store.js"></script>
</body>
</html>
