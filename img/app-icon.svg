<!-- 홈 화면 앱 아이콘의 원본입니다. 실제로 쓰이는 파일은 이것을 180x180 으로
     구워낸 app-icon-180.png 입니다 — iOS 는 apple-touch-icon 으로 SVG 를 받지
     않습니다. 모양을 고치려면 여기를 고치고 PNG 를 다시 구워야 합니다.

     항공 우편 소인(img/postmark.png)을 아이콘 크기로 줄인 그림입니다.
     · 바탕은 --page-bg(#EF3921). 흰 바탕도 만들어 봤는데, 밝은 배경화면에서는
       아이콘 경계가 녹아버려 혼자 흐릿해 보였습니다. 오렌지는 밝은 배경에서도
       어두운 배경에서도 똑같이 뜹니다.
     · 모서리를 굴리지 않습니다. iOS 가 알아서 잘라내므로 여기서 굴리면 두 번
       굴려집니다. 투명한 곳도 없어야 합니다 — 투명하면 검게 채워집니다.
     · 비행기는 선이 아니라 면(fill)입니다. 60px 로 줄면 선은 사라지지만
       면은 남습니다.
     · 도장 전체가 -8° 기울어 있고 비행기가 그 안에서 다시 -14° 기울어 있습니다
       (합쳐서 -22°). 원본 소인의 비행기 자세입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="#EF3921"/>
  <g transform="rotate(-8 90 90)">
    <!-- 도장 테두리 -->
    <circle cx="68" cy="90" r="45" fill="none" stroke="#ffffff" stroke-width="7"/>
    <!-- 비행기 — 위에서 내려다본 여객기. (0,0) 이 한가운데, 코가 +x 쪽입니다. -->
    <g transform="translate(68 90) rotate(-14) scale(1.15)">
      <path fill="#ffffff" d="M 24 0 C 23.5 -2 22 -3.2 20 -4 L 7 -5.4 L -4 -19 L -9 -19.6
        L -6 -5.8 L -14 -5.8 L -18 -10.6 L -22 -11 L -22.6 -4.6 L -24 0 L -22.6 4.6 L -22 11
        L -18 10.6 L -14 5.8 L -6 5.8 L -9 19.6 L -4 19 L 7 5.4 L 20 4 C 22 3.2 23.5 2 24 0 Z"/>
    </g>
    <!-- 소인의 물결선. 오른쪽 끝은 일부러 화면 밖으로 나갑니다 (원본과 같습니다). -->
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <path d="M 106 62 q 11 -11 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M 115 90 q 11 -11 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M 106 118 q 11 -11 22 0 t 22 0 t 22 0 t 22 0"/>
    </g>
  </g>
</svg>
