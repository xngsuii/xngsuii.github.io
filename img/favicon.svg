<!-- 브라우저 탭에 뜨는 마크(파비콘)입니다.

     홈 화면 앱 아이콘(app-icon.svg)과 같은 소인이지만 두 가지가 다릅니다.
     · 바탕이 없습니다. 탭 색은 브라우저와 설정에 따라 밝기도 어둡기도 해서,
       오렌지 잉크만 두면 양쪽 모두에서 보입니다. 바탕을 칠하면 한쪽에서
       네모난 딱지처럼 떠 보입니다.
     · 작은 크기용으로 다시 짰습니다. 실제로는 16px 로 보이는데, 앱 아이콘의
       구도(도장이 왼쪽, 물결이 오른쪽, 선 굵기 7)를 그대로 줄이면 선이
       0.6px 이 되어 사라집니다. 그래서 물결을 빼고 도장을 정중앙으로 옮긴 뒤
       테두리를 15 로 굵히고 비행기를 키웠습니다.

     같은 그림을 PNG 로도 구워 둡니다(favicon-16/32/48.png). SVG 파비콘을
     모르는 브라우저(사파리 16.3 이하 등)가 그쪽을 씁니다.
     **여기 숫자를 고치면 PNG 도 다시 구워야 합니다** — 굽는 법은 CLAUDE.md 에
     적어 두었습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <g transform="rotate(-8 90 90)">
    <!-- 도장 테두리 -->
    <circle cx="90" cy="90" r="62" fill="none" stroke="#EF3921" stroke-width="15"/>
    <!-- 비행기 — 위에서 내려다본 여객기. (0,0) 이 한가운데, 코가 +x 쪽입니다. -->
    <g transform="translate(90 90) rotate(-14) scale(1.95)">
      <path fill="#EF3921" d="M 24 0 C 23.5 -2 22 -3.2 20 -4 L 7 -5.4 L -4 -19 L -9 -19.6
        L -6 -5.8 L -14 -5.8 L -18 -10.6 L -22 -11 L -22.6 -4.6 L -24 0 L -22.6 4.6 L -22 11
        L -18 10.6 L -14 5.8 L -6 5.8 L -9 19.6 L -4 19 L 7 5.4 L 20 4 C 22 3.2 23.5 2 24 0 Z"/>
    </g>
  </g>
</svg>
